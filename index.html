<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Github Issues Tracker | Login</title>

     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
    body{
        font-family: "Work Sans", sans-serif;
    }
</style>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">

    <div class="card w-full max-w-sm bg-white shadow-lg rounded-none p-8 border border-slate-200">
        <!-- Logo and Header -->
        <div class="flex flex-col items-center mb-6">
            <div class="w-16 h-16 mb-4">
                <img src="./assets/github-logo.png" alt="github logo">
            </div>
            <h1 class="text-xl font-bold text-slate-800 text-center">GitHub Issues Tracker</h1>
            <p class="text-xs text-slate-500 mt-1">Sign in to manage your issues</p>
        </div>

        <!-- Form Section -->
        <!-- Ekhane FORM tag bebohar kora hoyeche -->
        <form id="login-form" class="space-y-4">
            <div class="form-control">
                <label class="block mb-1">
                    <span class="text-sm font-semibold text-slate-700">Username</span>
                </label>
                <input id="input-username" type="text" placeholder="Enter Username" class="border border-slate-300 p-2 text-sm w-full rounded-none focus:outline-sky-400" required />
                <p class="text-[10px] text-purple-600 mt-1">Default: admin</p>
            </div>

            <div class="form-control">
                <label class="block mb-1">
                    <span class="text-sm font-semibold text-slate-700">Password</span>
                </label>
                <input id="input-password" type="password" placeholder="Enter Password" class="border border-slate-300 p-2 text-sm w-full rounded-none focus:outline-sky-400" required />
                <p class="text-[10px] text-purple-600 mt-1">Default: admin123</p>
            </div>

            <!-- type="submit" deyar fole eta page reload korte chay -->
            <button id="login-btn" type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-full mt-4 transition-colors">
                Sign In
            </button>
        </form>

        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-slate-300"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-[10px] uppercase">OR</span>
            <div class="flex-grow border-t border-slate-300"></div>
        </div>

        <div class="text-center border border-dashed border-slate-300 p-3 bg-slate-50">
            <p class="text-[10px] text-slate-500 mb-2">Demo Credentials:</p>
            <p class="text-xs font-bold text-slate-700">Username: admin</p>
            <p class="text-xs font-bold text-slate-700">Password: admin123</p>
        </div>
    </div>

    <!-- JavaScript File -->
    <script src="./login.js"></script>
</body>
</html>
