<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com" rel="stylesheet">

    <style>
        body {
            font-family: "Work Sans", sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navbar: Responsive padding & stack on mobile -->
    <nav class="flex flex-col md:flex-row items-center justify-between px-4 md:px-10 py-4 border-b bg-white gap-4">
        <!-- Left: Logo & Name -->
        <div class="flex items-center gap-2">
            <img src="./assets/github-logo.png" class="w-8">
            <span class="font-semibold text-lg">GitHub Issues Tracker</span>
        </div>

        <!-- Right: Search & Button -->
        <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
            <!-- Search Box -->
            <div class="relative w-full sm:w-64">
                <span class="absolute left-3 top-2.5 text-gray-400">
                    <img src="./assets/MagnifyingGlass.png" alt="" class="w-5">
                </span>
                <!-- <input type="text" placeholder="Search issues..." class="pl-10 pr-4 py-2 border rounded-md w-full focus:outline-none focus:ring-1 focus:ring-purple-500"> -->
                 <input id="searchInput" onkeyup="handleSearch()" type="text" placeholder="Search issues..." 
       class="pl-12 pr-4 py-3 border border-gray-200 rounded-xl w-full focus:outline-none">

            </div>
            
            <!-- New Issue Button -->
            <button class="bg-[#5A10D5] text-white px-6 py-2 rounded-md font-medium w-full sm:w-auto hover:bg-purple-700 transition-colors">
                + New Issue
            </button>
        </div>
    </nav>

    <!-- Tab Section: Centered and responsive buttons -->
    <div class="px-4">
        <div class="flex p-1 shadow-sm rounded-lg max-w-4xl mx-auto mt-10 gap-2 bg-white overflow-x-auto">
            <button onclick="toggleTab(this,'all')" class="tab-btn flex-1 sm:flex-none px-6 md:px-8 py-2.5 rounded-md text-sm font-bold bg-[#4a00ff] text-white transition-all whitespace-nowrap">
                All
            </button>
            <button onclick="toggleTab(this,'open')" class="tab-btn flex-1 sm:flex-none px-6 md:px-8 py-2.5 rounded-md text-sm font-bold text-gray-500  transition-all whitespace-nowrap">
                Open
            </button>
            <button onclick="toggleTab(this,'closed')" class="tab-btn flex-1 sm:flex-none px-6 md:px-8 py-2.5 rounded-md text-sm font-bold text-gray-500  transition-all whitespace-nowrap">
                Closed
            </button>
        </div>
    </div>

    <!-- loading spinner -->
    <div id="loadingSpinner" class="h-[50vh] flex hidden justify-center items-center">
        <span class="loading loading-dots loading-xl text-purple-600"></span>
    </div>

    <div class="p-4 md:p-8 max-w-7xl mx-auto"> 

        <!-- Dynamic Count Section: Column on mobile, row on desktop -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-white p-6 rounded-xl shadow-sm border border-gray-100 gap-6">
            <!-- Left Side -->
            <div class="flex items-center gap-4">
                <div class="bg-purple-100 p-3 rounded-2xl hidden sm:block">
                    <img src="./assets/Group 1.png" alt="" class="w-8 h-8">
                </div>
                <div>
                    <h2 id="total-issues" class="text-2xl md:text-3xl font-bold text-gray-800">0 Issues</h2>
                    <p class="text-gray-500 text-sm mt-1">Track and manage your project issues</p>
                </div>
            </div>

            <!-- Right Side (Indicators) -->
            <div class="flex items-center gap-6 w-full md:w-auto border-t md:border-none pt-4 md:pt-0">
                <span class="flex items-center gap-2 text-sm font-bold text-gray-700">
                    <span class="w-2.5 h-2.5 bg-[#00C292] rounded-full"></span> 
                    <span id="open-count">0 Open</span>
                </span>
                <span class="flex items-center gap-2 text-sm font-bold text-gray-700">
                    <span class="w-2.5 h-2.5 bg-[#A855F7] rounded-full"></span> 
                    <span id="closed-count">0 Closed</span>
                </span>
            </div>
        </div>

        <!-- Issues Cards Container: Responsive Grid (1 column on mobile, 2 on tablet, 4 on desktop) -->
        <div id="issues-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6">
            <!-- Cards dynamic bhabe JS diye ashbe -->
        </div>
    </div>

    <!-- Modal: modal-bottom for mobile and modal-middle for desktop -->
    <dialog id="issue_details_modal" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box max-w-3xl bg-white p-6 md:p-10 rounded-t-2xl sm:rounded-2xl border-t-8 border-[#4a00ff]">
            <div id="modal-content">
                <!-- dynamic data ekhane ashbe -->
            </div>
            <div class="modal-action">
                <form method="dialog" class="w-full sm:w-auto">
                    <button class="btn bg-[#4a00ff] hover:bg-[#3a00cc] text-white px-10 border-none w-full sm:w-auto">Close</button>
                </form>
            </div>
        </div>
        <!-- <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form> -->
    </dialog>

    <script src="main.js"></script>
</body>
</html>
