<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
    body{
        font-family: "Work Sans", sans-serif;
    }
</style>
</head>
<body>
   <nav class="flex items-center justify-between px-6 py-3 border-b">
  <!-- Left: Logo & Name -->
  <div class="flex items-center gap-2">
    <img src="./assets/github-logo.png" class="w-8">
    <span class="font-semibold">GitHub Issues Tracker</span>
  </div>

  <!-- Right: Search & Button -->
  <div class="flex items-center gap-4">
    <!-- Search Box with Icon -->
    <div class="relative">
      <span class="absolute left-3 top-2.5 text-gray-400"><img src="./assets/MagnifyingGlass.png" alt=""></span>
      <input type="text" placeholder="Search issues..." class="pl-10 pr-4 py-2 border rounded-md">
    </div>
    
    <!-- New Issue Button -->
    <button class="bg-[#5A10D5] text-white px-4 py-2 rounded-md font-medium">
      + New Issue
    </button>
  </div>
</nav>

 <!-- Tab Section -->
<div class="shadow-sm rounded-lg p-3 max-w-4xl mx-auto mt-10">
    
    <!-- tab button container -->
    <div class="flex p-1 bg-gray-50 rounded-lg gap-2 w-fit">
        
        <!-- 'All' button (Active State) -->
        <button id="all-btn" onclick="toggleTab('all-btn')" 
            class="px-8 py-2.5 rounded-md text-sm font-bold bg-[#4a00ff] text-white transition-all">
            All
        </button>
        
        <!-- 'Open' button -->
        <button id="open-btn" onclick="toggleTab('open-btn')" 
            class="px-8 py-2.5 rounded-md text-sm font-bold bg-#e4e4e7 text-gray-500 border border-transparent hover:border-gray-200 transition-all">
            Open
        </button>
        
        <!-- 'Closed' button -->
        <button id="closed-btn" onclick="toggleTab('closed-btn')" 
            class="px-8 py-2.5 rounded-md text-sm font-bold bg-#4e4e7 text-gray-500 border border-transparent hover:border-gray-200 transition-all">
            Closed
        </button>
        
    </div>
</div>

</body>
</html>
