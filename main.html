<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
    body{
        font-family: "Work Sans", sans-serif;
    }
</style>
</head>
<body>
   <nav class="flex items-center justify-between px-6 py-3 border-b">
  <!-- Left: Logo & Name -->
  <div class="flex items-center gap-2">
    <img src="./assets/github-logo.png" class="w-8">
    <span class="font-semibold">GitHub Issues Tracker</span>
  </div>

  <!-- Right: Search & Button -->
  <div class="flex items-center gap-4">
    <!-- Search Box with Icon -->
    <div class="relative">
      <span class="absolute left-3 top-2.5 text-gray-400"><img src="./assets/MagnifyingGlass.png" alt=""></span>
      <input type="text" placeholder="Search issues..." class="pl-10 pr-4 py-2 border rounded-md">
    </div>
    
    <!-- New Issue Button -->
    <button class="bg-[#5A10D5] text-white px-4 py-2 rounded-md font-medium">
      + New Issue
    </button>
  </div>
</nav>
<!-- Tab Section -->
 <div class="flex p-1 m-auto shadow-sm rounded-lg p-3 max-w-4xl mx-auto mt-10 gap-2">
    <!-- All -->
    <button onclick="toggleTab(this,'all' )" class="tab-btn px-8 py-2.5 rounded-md text-sm font-bold bg-[#4a00ff] text-white transition-all">
        All
    </button>
    <!-- open -->
    <button onclick="toggleTab(this,'open')" class="tab-btn px-8 py-2.5 rounded-md text-sm font-bold shadow-sm text-gray-500 hover:border-gray-200 transition-all">
        Open
    </button>
    <!-- closed -->
    <button onclick="toggleTab(this,'closed')" class="tab-btn px-8 py-2.5 rounded-md text-sm shadow-sm font-bold text-gray-500 hover:border-gray-200 transition-all">
        Closed
    </button>
</div>


  <!-- loading spinner -->
                <div id="loadingSpinner" class="h-[60vh] flex hidden justify-center items-center">
                    <span class="loading loading-dots loading-xl"></span>
                </div>

                <div class="p-8 max-w-7xl mx-auto">


<!-- Dynamic Count Section -->
<div class="flex justify-between items-center mb-6 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
    <!-- Left Side: Icon and Title -->
    <div class="flex items-center gap-4">
        <div class="bg-purple-100 p-3 rounded-2xl">
            <img src="./assets/Group 1.png" alt="" class="w-8 h-8">
        </div>
        <div>
            <h2 id="total-issues" class="text-3xl font-bold text-gray-800">0 Issues</h2>
            <p class="text-gray-500 text-sm mt-1">Track and manage your project issues</p>
        </div>
    </div>

    <!-- Right Side: Open/Closed Indicators (Image er moto dan pashe) -->
    <div class="flex items-center gap-6">
        <span class="flex items-center gap-2 text-sm font-bold text-gray-700">
            <span class="w-2.5 h-2.5 bg-[#00C292] rounded-full"></span> 
            <span id="open-count"> Open</span>
        </span>
        <span class="flex items-center gap-2 text-sm font-bold text-gray-700">
            <span class="w-2.5 h-2.5 bg-[#A855F7] rounded-full"></span> 
            <span id="closed-count">Closed</span>
        </span>
    </div>
</div>

<!-- Issues Cards Container -->
<div id="issues-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <!-- Cards dynamic bhabe JS diye ashbe -->
</div>

<script src="main.js"></script>
</body>
</html>
